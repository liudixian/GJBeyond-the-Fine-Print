<title>细则之外：租客规约｜2D 原型</title>
<style>
:root{--bg:#161718;--panel:#222527;--panel2:#2d3133;--ink:#eee8d7;--muted:#a8a092;--accent:#e2b56f;--danger:#b75b5b;--ok:#7fb58b;--line:#474b4d}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 50% 20%,#363331 0,#171819 55%);color:var(--ink);font-family:Georgia,"Microsoft YaHei",serif;min-height:100vh}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid #5b5e5e;border-radius:6px;padding:8px 12px;cursor:pointer;transition:.15s}button:hover{border-color:var(--accent);transform:translateY(-1px)}button:disabled{opacity:.45;cursor:not-allowed;transform:none}
#app{max-width:1220px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:14px}.brand h1{font-size:24px;letter-spacing:.06em;margin:0 0 4px}.brand p{margin:0;color:var(--muted);font-size:13px}.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.chip{border:1px solid var(--line);padding:7px 10px;border-radius:999px;font-size:13px;background:#1f2223}.chip b{color:var(--accent);font-weight:600}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px}.scene{background:linear-gradient(145deg,#292c2d,#1d2021);border:1px solid #565654;border-radius:10px;min-height:650px;position:relative;overflow:hidden;box-shadow:0 16px 50px #0008}.room{position:absolute;inset:0;background:linear-gradient(180deg,#303334 0 70%,#202324 70%);}.ceiling{position:absolute;left:0;right:0;top:0;height:16%;background:linear-gradient(180deg,#4b4742,#302f2c);border-bottom:2px solid #655b4e}.wallline{position:absolute;left:0;right:0;top:70%;border-top:2px solid #514a42}.floor{position:absolute;left:0;right:0;bottom:0;height:30%;background:repeating-linear-gradient(90deg,#2b2c2c 0 70px,#292a2a 70px 140px);opacity:.9}.door{position:absolute;right:5%;top:20%;width:18%;height:49%;background:#493c32;border:5px solid #6d5742;box-shadow:inset 0 0 0 4px #2a2420}.door:after{content:'204';position:absolute;top:17%;left:36%;color:#d7ba83;font-size:17px;letter-spacing:.2em}.handle{position:absolute;right:12%;top:53%;width:10px;height:10px;border-radius:50%;background:#d1aa62}.window{position:absolute;left:6%;top:25%;width:25%;height:26%;background:linear-gradient(140deg,#14222a,#273f4b);border:7px solid #604c3e;box-shadow:0 0 0 2px #251f1b}.window:before,.window:after{content:'';position:absolute;background:#765c49}.window:before{width:5px;top:0;bottom:0;left:50%}.window:after{height:5px;left:0;right:0;top:50%}.curtain{position:absolute;left:4%;top:21%;width:7%;height:34%;background:#6b3941;opacity:.82;border-radius:2px 0 0 2px}.curtain.r{left:27%;border-radius:0 2px 2px 0}.fridge{position:absolute;left:34%;top:30%;width:10%;height:34%;background:linear-gradient(90deg,#6d7472,#aab3ac 50%,#68706e);border:4px solid #424846;border-radius:3px;box-shadow:8px 8px 0 #16191855}.fridge:before{content:"";position:absolute;left:8%;right:8%;top:52%;border-top:2px solid #4e5754}.fridge:after{content:"";position:absolute;right:9%;top:18%;height:7px;width:3px;background:#d7c19b;box-shadow:0 72px 0 #d7c19b}
.sofa{position:absolute;left:38%;bottom:16%;width:28%;height:18%;background:#5c5349;border:4px solid #746555;border-radius:14px 14px 4px 4px}.sofa:before{content:'';position:absolute;left:5%;right:5%;top:16%;height:45%;background:#6b6256;border-radius:8px}.table{position:absolute;left:42%;bottom:8%;width:18%;height:7%;background:#795c3f;border:3px solid #9b7650;border-radius:50%}.plant{position:absolute;left:31%;bottom:15%;width:8%;height:20%;}.plant .pot{position:absolute;bottom:0;left:18%;width:64%;height:28%;background:#8f5840;clip-path:polygon(10% 0,90% 0,75% 100%,25% 100%)}.plant .leaf{position:absolute;width:35px;height:74px;border-radius:100% 0 100% 0;background:#4f754e;transform-origin:bottom center}.leaf.a{left:26%;bottom:21%;transform:rotate(-27deg)}.leaf.b{left:47%;bottom:20%;transform:rotate(22deg);background:#658952}.leaf.c{left:35%;bottom:31%;transform:rotate(4deg);background:#789a5e}.mirror{position:absolute;right:27%;top:22%;width:13%;height:31%;background:linear-gradient(135deg,#8a9ca0,#34454a 55%,#899a9a);border:6px solid #735d4b;box-shadow:0 0 18px #0008}.mirror:after{content:'?';position:absolute;inset:0;display:grid;place-items:center;font-size:32px;color:#d8e0dc66}.slippers{position:absolute;right:27%;bottom:15%;font-size:38px;letter-spacing:-17px;transform:rotate(-6deg);filter:sepia(.4)}.clock{position:absolute;left:43%;top:18%;width:74px;height:74px;border-radius:50%;border:5px solid #98876c;background:#dfd2b7;color:#2d2924;display:grid;place-items:center;font:bold 19px Georgia}.clock:after{content:'';position:absolute;height:23px;width:3px;background:#3d3429;top:13px;left:34px;transform:rotate(15deg);transform-origin:bottom}.hotspot{position:absolute;border:1px dashed transparent;background:transparent}.hotspot:hover{border-color:var(--accent);background:#e2b56f14}.hs-door{right:4%;top:18%;width:20%;height:53%}.hs-window{left:5%;top:22%;width:29%;height:32%}.hs-fridge{left:35%;top:30%;width:10%;height:33%}.hs-plant{left:29%;bottom:12%;width:12%;height:27%}.hs-mirror{right:25%;top:19%;width:17%;height:37%}.hs-slippers{right:23%;bottom:10%;width:20%;height:18%}.hs-clock{left:40%;top:15%;width:13%;height:15%}.hs-notebook{left:3%;bottom:4%;width:22%;height:10%}.hint{position:absolute;left:18px;bottom:16px;color:#c8bea9;font-size:12px;background:#151717aa;padding:6px 9px;border-radius:4px}
.sidebar{display:flex;flex-direction:column;gap:12px}.panel{background:linear-gradient(180deg,#272a2b,#1e2122);border:1px solid var(--line);border-radius:10px;padding:14px}.panel h2{font-size:15px;margin:0 0 10px;color:var(--accent);letter-spacing:.08em}.log{height:260px;overflow:auto;font-size:13px;line-height:1.55;color:#d6cfbf}.log p{margin:0 0 9px;padding-bottom:8px;border-bottom:1px solid #ffffff0d}.log .em{color:#f1c684}.rules{display:flex;flex-direction:column;gap:7px;max-height:235px;overflow:auto}.rule{padding:8px 9px;background:#191b1c;border-left:3px solid #6b6e6e;font-size:12px;line-height:1.45}.rule.found{border-left-color:var(--accent)}.rule small{color:var(--muted);display:block;margin-top:3px}.actions{display:flex;flex-wrap:wrap;gap:7px}.notice{font-size:12px;color:#d3c8b2;line-height:1.55}.notice strong{color:#e5bc7e}.modal{position:fixed;inset:0;background:#070809c7;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal.show{display:flex}.paper{max-width:680px;width:100%;max-height:85vh;overflow:auto;background:#e7ddc5;color:#2c2924;padding:32px 38px;border:10px solid #715940;box-shadow:0 22px 90px #000;transform:rotate(-.5deg)}.paper h2{text-align:center;margin:0 0 18px;font-size:24px}.paper p{line-height:1.7;margin:8px 0}.paper ol{line-height:1.85;padding-left:24px}.paper .close{display:block;margin:22px auto 0;background:#493e31;color:#f0e6d3;border-color:#493e31}.ending{text-align:center;padding:12px}.ending h3{color:var(--accent);font-size:23px;margin:8px 0}.ending p{line-height:1.75;color:#ddd3c0}.progress{height:6px;background:#151718;border-radius:99px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#98704a,#e2b56f);width:0;transition:.3s}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{display:grid;grid-template-columns:1fr 1fr}.panel:first-child{grid-column:1/-1}.scene{min-height:540px}}@media(max-width:620px){#app{padding:10px}.sidebar{display:flex}.scene{min-height:470px}.brand h1{font-size:18px}.paper{padding:24px 20px}.sofa{left:39%;width:30%}}
</style>
</head>
<body>
<div id="app">
  <div class="top"><div class="brand"><h1>细则之外：租客规约</h1><p>Beyond the Fine Print · 点击物件，阅读线索，决定要不要相信规则。</p></div><div class="stats"><span class="chip">第 <b id="day">1</b> 天</span><span class="chip">时段：<b id="phase">傍晚</b></span><span class="chip">时间：<b id="clockTime">18:20</b></span><span class="chip">异常：<b id="anomaly">0</b></span><span class="chip">警觉：<b id="suspicion">0</b></span><span class="chip">线索：<b id="clueCount">0</b></span></div></div>
  <div class="layout">
    <main class="scene"><div class="room"><div class="ceiling"></div><div class="wallline"></div><div class="floor"></div><div class="door"><div class="handle"></div></div><div class="window"></div><div class="curtain"></div><div class="curtain r"></div><div class="fridge"></div><div class="sofa"></div><div class="table"></div><div class="plant"><i class="leaf a"></i><i class="leaf b"></i><i class="leaf c"></i><div class="pot"></div></div><div class="mirror"></div><div class="slippers">◡◡</div><div class="clock">11:48</div>
      <button class="hotspot hs-door" data-action="door" aria-label="入户门"></button><button class="hotspot hs-window" data-action="window" aria-label="窗"></button><button class="hotspot hs-fridge" data-action="fridge" aria-label="冰箱"></button><button class="hotspot hs-plant" data-action="plant" aria-label="植物"></button><button class="hotspot hs-mirror" data-action="mirror" aria-label="镜子"></button><button class="hotspot hs-slippers" data-action="slippers" aria-label="拖鞋"></button><button class="hotspot hs-clock" data-action="clock" aria-label="时钟"></button><button class="hotspot hs-notebook" data-action="notebook" aria-label="心理笔记"></button>
      <div class="hint">点击场景中的物件进行调查 · 右侧日志会记录你读到的内容</div></div></main>
    <aside class="sidebar">
      <section class="panel"><h2>现场记录</h2><div id="log" class="log"></div></section>
      <section class="panel"><h2>已掌握的规则</h2><div id="rules" class="rules"></div></section>
      <section class="panel"><h2>假设记录板</h2><div id="hypotheses" class="rules"></div></section>
      <section class="panel"><h2>物品与痕迹</h2><div id="inventory" class="notice"></div></section>
      <section class="panel"><h2>行动</h2><div class="actions"><button id="advance">推进时间</button><button id="wait10">等待 10 分钟</button><button id="midnight">午夜实验</button><button id="knock">回应敲门</button><button id="returnRules">放回守则</button><button id="rentout">尝试退租</button><button id="reset">重置原型</button></div><div class="progress"><i id="progress"></i></div><p class="notice" id="status">你刚拿到钥匙。房东说：<strong>“只要别故意犯，也没啥事。”</strong></p></section>
    </aside>
  </div>
</div>
<div id="modal" class="modal"><article class="paper" id="paper"></article></div>
<script>
const $=s=>document.querySelector(s); const state={day:1,phase:1,minute:18*60+20,anomaly:0,suspicion:0,attention:0,clues:[],rules:[],knocks:0,responded:0,milk:0,mirrorClean:false,windowSafe:true,ending:false,notes:[],rulesReturned:false,plantPours:0,plantDirection:'normal',hypotheses:[],midnightSolved:false,landlordChecks:0};
const phases=['傍晚','深夜','凌晨 3:33','清晨'];
const hypothesisData=[['visitor','植物会为窗外访客导航','植物转向窗户后，窗外的东西会回应。',()=>state.plantDirection==='window'&&state.attention>0],['knock','相同节奏是一条安全缝隙','回应敲门会把不同的访客分开。',()=>state.responded>0&&state.knocks>0],['mirror','镜子记录最后一次异常','擦净并再次观察，镜子会保存现场。',()=>state.mirrorClean&&state.mirrorSeen],['reverse','午夜可以反向执行规则','鞋尖朝内、喝光牛奶并保持窗帘合上。',()=>state.midnightSolved&&state.milk===0]];
function timeText(){return `${String(Math.floor((state.minute%1440)/60)).padStart(2,'0')}:${String(state.minute%60).padStart(2,'0')}`}
const ruleData={door:['晚上不可以出门。','夜里门锁像被什么从里面扣住。'],window:['听见敲窗声，不要拉开窗帘，不要回应。','手电筒可以驱逐“访客”，但会让它记住你的房间。'],fridge:['晚餐若与前一餐相同，必须要求退回。','冰箱底部粘着一张被撕掉一半的便签。'],plant:['植物不需要浇水。','牛奶倒进盆里会让叶片短暂转向窗外。'],mirror:['走廊尽头的镜子必须保持洁净。','镜中若出现你未做的动作，请停止模仿。'],slippers:['拖鞋鞋尖必须朝外。','鞋底夹着一小片纸：规则最怕被同时执行。'],clock:['若时间停在某一刻，请不要确认时间。','钟面停在 11:48，秒针却在走。'],notebook:['心理笔记：把“发生过的事”和“守则写的事”分开记录。','有些规则只在被阅读后才会生效。']};
function log(text,em=false){const p=document.createElement('p');p.innerHTML=em?`<span class="em">${text}</span>`:text;$('#log').prepend(p)}
function addClue(id){if(!state.clues.includes(id)){state.clues.push(id);update();}}
function addRule(id){if(!state.rules.includes(id)){state.rules.push(id);update();log('你把一条规则抄进了自己的笔记。',true)}}
function update(){ $('#day').textContent=state.day;$('#phase').textContent=phases[state.phase];$('#clockTime').textContent=timeText();$('#anomaly').textContent=state.anomaly;$('#suspicion').textContent=state.suspicion;$('#clueCount').textContent=state.clues.length;$('#progress').style.width=Math.min(100,(state.clues.length+state.hypotheses.length*2)/14*100)+'%'; const rs=$('#rules');rs.innerHTML=''; state.rules.forEach((id,i)=>{const d=ruleData[id];const el=document.createElement('div');el.className='rule found';el.innerHTML=`<b>规则 ${i+1}</b>　${d[0]}<small>${d[1]}</small>`;rs.append(el)}); if(state.rules.length===0)rs.innerHTML='<div class="rule"><b>暂无</b><small>先查看门上的入住须知。</small></div>'; const hs=$('#hypotheses');hs.innerHTML='';hypothesisData.forEach(h=>{const solved=state.hypotheses.includes(h[0]);const el=document.createElement('div');el.className='rule '+(solved?'found':'');el.innerHTML=`<b>${solved?'✓ ':''}${h[1]}</b><small>${h[2]}</small>`;if(!solved){const b=document.createElement('button');b.className='small';b.textContent='验证';b.disabled=!h[3]();b.onclick=()=>{state.hypotheses.push(h[0]);addClue('假设:'+h[1]);log('假设得到验证：'+h[2],true);update()};el.append(b)}hs.append(el)});$('#inventory').innerHTML=`牛奶：${state.milk} 口 · 植物：${state.plantDirection==='window'?'朝向窗户':state.plantDirection==='mimic'?'正在模仿':'正常'} · 房东检查：${state.landlordChecks} 次 · 午夜实验：${state.midnightSolved?'已完成':'未完成'}` }
function modal(title,body,button='合上纸页'){ $('#paper').innerHTML=`<h2>${title}</h2>${body}<button class="close">${button}</button>`;$('#modal').classList.add('show');$('.close').onclick=()=>$('#modal').classList.remove('show') }
function inspect(a){
 if(state.ending)return;
 if(a==='door'){addRule('door');addClue('rules');modal('门上的《入住须知》',`<p>欢迎入住“富贵德福所公寓·204室”。每一条都有其存在的理由。</p><ol><li>晚上不可以出门。</li><li>不允许随意挪动家具。</li><li>晚餐若餐品相同，请要求退回。</li><li>卧室 3 不可进入。</li><li>听见敲窗声，不要拉开窗帘，不要回应。</li><li>镜子必须保持洁净。</li><li>凌晨 3:33 不要进入厕所。</li><li>植物不需要浇水。</li></ol><p>附则：退租时将本须知原样放回鞋柜抽屉。七天后检查，若规则被遵守，押金三倍退还。</p>`);return}
 if(a==='window'){addRule('window');addClue('window');log('窗外传来三下敲击：笃、笃、笃。窗帘后有一块影子。',true);return}
 if(a==='fridge'){addRule('fridge');addClue('milk');modal('冰箱里的便签',`<p>“如果今天的晚餐和昨天一样，请退回去。它们会记得你吃过什么。”</p><p>牛奶瓶底贴着一行小字：<b>别把第二口留给植物。</b></p>`);return}
 if(a==='plant'){addRule('plant');if(state.milk===0){state.milk=1;state.plantPours++;state.plantDirection='window';state.attention++;addClue('plant');log('你把牛奶倒进盆栽。叶片齐齐朝向窗户，随后恢复原样。',true);$('#status').textContent='植物短暂地指向窗外，像在提示一条看不见的路线。'} else {state.milk--;state.plantPours++;state.plantDirection=state.plantPours>1?'mimic':'window';state.attention++;if(state.plantPours>1)state.anomaly++;log(state.plantPours>1?'植物的叶子学会了你的手势。':'你把一口牛奶倒进盆栽，叶片齐齐转向窗户。',true);$('#status').textContent='植物状态改变了。'}}
 if(a==='mirror'){addRule('mirror');if(!state.mirrorClean){state.mirrorClean=true;addClue('mirror');log('你擦净镜面。镜中的你慢了半拍，随后恢复同步。',true)}else{state.mirrorSeen=true;state.anomaly++;log('镜中的你先抬起了手。你立刻停止模仿。',true)}return}
 if(a==='slippers'){addRule('slippers');addClue('slippers');log('拖鞋鞋尖朝外。鞋底的纸片写着：规则之间会互相借力。',true);return}
 if(a==='clock'){addRule('clock');log('你没有触碰钟面。11:48 的秒针停了。',true);return}
 if(a==='notebook'){addClue('notes');modal('心理笔记',`<p>“不要急着找出哪条规则是真的。先观察它们何时出现，又在保护谁。”</p><p>目前的矛盾：植物说不需要浇水，但牛奶瓶底却留下了“第二口”的警告。</p>`);}
 update();
}
function advance(minutes=60){if(state.ending)return;state.minute+=minutes;const n=state.minute%1440;if(state.minute>=1440){state.day++;state.minute%=1440;log(`第 ${state.day} 天开始。昨夜的房间比记忆中更窄。`,true)}state.phase=n>=3*60&&n<6*60?2:n>=18*60?0:1;if(n>=3*60+33&&n<4*60){log('3:33。厕所水龙头自动打开，三分钟内不要进去。',true)}if(n>=8*60&&n<9*60&&state.suspicion>0){state.landlordChecks++;log('清晨，王姨站在门外检查鞋尖和窗帘。',true);if(state.suspicion>1)state.anomaly++}update();}
function wait10(){advance(10);log('你等了十分钟。房间的声音换了一个方向。',true);update()}
function midnight(){state.minute=23*60+50;showModal('午夜实验',`<p>你把钟拨到 23:50。窗外敲了三下。</p><p>选择一组动作，观察规则之间是否会互相抵消。</p>`,[{label:'喝光牛奶，拖鞋朝内，窗帘合上',action:()=>{state.milk=0;state.midnightSolved=true;state.suspicion++;state.minute=5;log('你执行反向规则：喝光牛奶、鞋尖朝内、保持不回应。房间短暂失去你的定位。',true);addClue('午夜反向实验');update()}},{label:'打开窗户',action:()=>{state.minute=5;state.anomaly+=2;state.suspicion+=2;log('午夜的空气进了屋子。窗外的声音开始模仿你的呼吸。',true);update()}},{label:'打开手电筒',action:()=>{state.minute=5;state.midnightSolved=true;log('手电筒驱散影子，墙上留下像门一样的亮斑。',true);addClue('午夜手电');update()}}]);}
function knock(){if(state.ending)return;state.knocks++;if(state.knocks===1){log('门外：笃、笃、笃。你按相同节奏敲回去，脚步声离开了。',true);state.responded++;addClue('knock');$('#status').textContent='你发现“不要回应”与“回应相同节奏”之间存在缝隙。'}else{log('敲门声变得急促。你没有先开门。',true);state.responded++;}update()}
function returnRules(){if(state.ending)return;if(!state.clues.includes('rules')){log('你还不知道守则原本放在哪里。先点击入户门，完整阅读《入住须知》。',true);$('#status').textContent='先阅读门上的《入住须知》，再把它原样放回鞋柜抽屉。';return}if(state.rulesReturned){log('鞋柜抽屉已经合上。守则保持着拿到时的顺序。',true);$('#status').textContent='守则已原样放回。现在可以尝试退租。';return}state.rulesReturned=true;addClue('return');log('你把《入住须知》按原来的顺序放回入户门旁鞋柜的抽屉。没有折痕，也没有少页。',true);$('#status').textContent='原样放回已完成。现在可以尝试退租。';update()}
function tryRentout(){if(state.ending)return; if(!state.rulesReturned){log('退租流程还不完整：你还没有理解“原样放回”意味着什么。',true);$('#status').textContent='点击“放回守则”，将《入住须知》原样放回鞋柜抽屉。';return} if(state.midnightSolved&&state.hypotheses.includes('reverse')){end('breaker')}else if(state.clues.includes('rules')&&state.clues.includes('notes')&&state.rules.length>=6&&state.anomaly===0&&state.suspicion<=1&&state.hypotheses.length>=2){end('good')}else if(state.anomaly>=3){end('bad')}else{log('房东还会发现一些痕迹。继续验证假设，或先降低异常和警觉。',true);$('#status').textContent='退租需要异常低、警觉低，并至少验证两个假设。';}}
function end(type){state.ending=true; if(type==='breaker'){modal('隐藏结局：规则之外',`<div class="ending"><h3>格式化者</h3><p>你在午夜反向执行规则，房间失去了对你的定位。镜子恢复成普通玻璃，窗外的东西忘记了你的名字。</p></div>`,'重新体验')}else if(type==='good'){modal('结局：安全离开',`<div class="ending"><h3>规则破解者</h3><p>你把守则按原样放回鞋柜，异常和警觉都很低。七天后的检查没有找到痕迹，天亮时你走出大门。</p></div>`,'重新体验')}else{modal('结局：永远租客',`<div class="ending"><h3>你没有离开 204 室</h3><p>房间记住了你的每一次犹豫。下一次敲门时，门外传来的声音和你一模一样。</p></div>`,'重新体验')}$('.close').onclick=()=>location.reload()}
 document.querySelectorAll('.hotspot').forEach(b=>b.addEventListener('click',()=>inspect(b.dataset.action)));$('#advance').onclick=()=>advance(60);$('#wait10').onclick=wait10;$('#midnight').onclick=midnight;$('#knock').onclick=knock;$('#returnRules').onclick=returnRules;$('#rentout').onclick=tryRentout;$('#reset').onclick=()=>location.reload();$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').classList.remove('show')});
log('房东王姨把钥匙放进你手里：“便宜、干净、省心。” 房门关上了。',true);log('你现在在 204 室的安全屋。第一件事：阅读门上的守则。');update();
