<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>细则之外 · 204 室</title><link rel="stylesheet" href="style.css"><script defer src="engine.js"></script><script defer src="maps.js"></script><script defer src="game.js"></script></head>
